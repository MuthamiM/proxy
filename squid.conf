# ============================================
# ELITE ANONYMOUS PROXY - USA (Miami, FL)
# Anonymity Level: Maximum (Elite/L1)
# Undetectable as proxy
# ============================================

# --- Port ---
http_port 3128

# --- Authentication ---
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/proxy_users
auth_param basic children 5
auth_param basic realm USA Proxy - Enter Credentials
auth_param basic credentialsttl 2 hours

# --- Access Control Lists ---
acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# --- Access Rules ---
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated
http_access deny all

# =============================================
# ELITE ANONYMITY - MAXIMUM STEALTH
# =============================================

# 1. NEVER forward the client's real IP
forwarded_for delete

# 2. Strip ALL proxy-revealing request headers
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
request_header_access X-Forwarded-Host deny all
request_header_access X-Forwarded-Server deny all
request_header_access X-Real-IP deny all
request_header_access X-Proxy-ID deny all
request_header_access X-BlueCoat-Via deny all
request_header_access Proxy-Connection deny all
request_header_access Proxy-Authorization deny all
request_header_access Forwarded deny all
request_header_access Client-IP deny all
request_header_access Referer deny all
request_header_access From deny all
request_header_access Cache-Control deny all

# 3. Strip ALL proxy-revealing response headers
reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all
reply_header_access X-Squid-Error deny all
reply_header_access X-Proxy-ID deny all
reply_header_access Proxy-Connection deny all
reply_header_access X-Forwarded-For deny all
reply_header_access Forwarded deny all
reply_header_access Server deny all
reply_header_access Link deny all

# 4. Do NOT add Via header at all
via off

# 5. Hide the hostname — use a generic name
visible_hostname localhost

# 6. Suppress Squid version in error pages
httpd_suppress_version_string on

# 7. Disable ALL Squid identifying features in errors
error_default_language en
err_page_stylesheet none

# 8. Disable ICP (Inter-Cache Protocol) — prevents discovery
icp_port 0
icp_access deny all

# 9. Disable HTCP
htcp_port 0
htcp_access deny all

# 10. Disable SNMP — prevents monitoring/detection
snmp_port 0
snmp_access deny all

# 11. Disable cache manager access from outside
http_access deny manager

# 12. Disable X-Cache headers entirely
# (already done via reply_header_access above)

# 13. Disable Squid's TRACE method (fingerprinting prevention)
acl TRACE_METHOD method TRACE
http_access deny TRACE_METHOD

# 14. Randomize outgoing TCP source ports (anti-fingerprint)
client_persistent_connections on
server_persistent_connections on

# 15. Disable unique_host_header (prevents hostname leak)
unique_hostname off

# --- Logging (minimal for privacy) ---
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
# Strip client IPs from logs too (privacy)
strip_query_terms on

# --- Performance ---
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 64 MB
cache_dir ufs /var/spool/squid 1000 16 256

# --- Connection tuning ---
connect_timeout 30 seconds
read_timeout 3 minutes
request_timeout 3 minutes
persistent_request_timeout 1 minute
client_lifetime 8 hours

# --- Misc ---
coredump_dir /var/spool/squid

# Disable WCCP (Web Cache Communication Protocol)
wccp_router 0.0.0.0
wccp2_router 0.0.0.0

# --- Outgoing WireGuard Egress (Proton US / 155.117.189.107) ---
tcp_outgoing_address 10.2.0.2
